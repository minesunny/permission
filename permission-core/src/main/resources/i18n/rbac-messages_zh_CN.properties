rbac.validation.dept-name-required=部门名称 (deptName) 不能为空
rbac.validation.path-required=部门路径 (path) 不能为空
rbac.validation.path-empty=路径不能为空
rbac.validation.path-start-slash=路径必须以 '/' 开头
rbac.validation.dept-identifier-required=[{0}]: 部门标识 (id, deptName 或 path) 不能为空
rbac.validation.user-identifier-required=[{0}]: 用户标识不能为空
rbac.validation.session-required=会话对象 (session) 不能为空
rbac.validation.search-condition-required=[{0}]: {1} 查询规约条件不能为空

